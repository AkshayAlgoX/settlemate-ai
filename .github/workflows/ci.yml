name: SettleMate AI — CI / CD & Financial Correctness Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Build & Benchmark Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: "test"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Database Schema
        run: npm run init-db

      - name: Run Static Code Analysis & Linting
        run: npm run lint

      - name: Verify Production Next.js Build
        run: npm run build

      - name: Execute Full Deterministic Test Pipeline
        run: npm test

      - name: Verify Official Razorpay Track 04 Benchmark & SHA-256 Fingerprint
        run: npm run evaluate

      - name: Verify Decision Receipt Offline Verifier
        run: npm run verify:receipt -- tests/fixtures/canonical-decision-receipt.json

      - name: Verify Live Demo Ingestion Script
        run: npm run verify:demo

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-results
          path: |
            docs/FINAL_METRICS.json
            docs/CLAIMS_MATRIX.md
          retention-days: 14

  publish:
    name: Build & Publish Production Container (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build & Push Production linux/amd64 Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
