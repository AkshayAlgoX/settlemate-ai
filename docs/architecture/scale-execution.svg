<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="100%" height="100%" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="scale-arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="scale-arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Canvas Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="24" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="-0.5">SETTLEMATE AI — DURABLE BOUNDED STEP EXECUTION</text>
    <text x="0" y="44" fill="#64748b" font-size="11" font-weight="500">Client-Coordinated Stepping · Persistent Monotonic State · Bounded Slices · Cooperative Cancellation</text>
    
    <!-- Header Badge -->
    <rect x="990" y="4" width="350" height="36" rx="4" fill="#111c30" stroke="#1e3a5f" stroke-width="1" />
    <text x="1165" y="26" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Durable Bounded Execution · No Monolithic HTTP Job</text>
  </g>

  <!-- Flow Loop (7 Stages) -->
  <g transform="translate(30, 85)">
    <!-- Stage 1: Operations Center -->
    <g transform="translate(0, 0)">
      <rect width="170" height="150" rx="6" fill="#0d172a" stroke="#2563eb" stroke-width="1.2" />
      <rect width="170" height="28" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.2" />
      <text x="12" y="19" fill="#bfdbfe" font-size="10.5" font-weight="700">1. OPERATIONS CENTER</text>
      
      <text x="12" y="48" fill="#ffffff" font-size="10" font-weight="600">Client Stepper Coordinator</text>
      <text x="12" y="66" fill="#94a3b8" font-size="9">· Drives execution cycle</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9">· Ref-based execution mutex</text>
      <text x="12" y="94" fill="#94a3b8" font-size="9">· Continuous micro-yields</text>
      <text x="12" y="108" fill="#94a3b8" font-size="9">· Handles 429 backoff</text>
      <text x="12" y="132" fill="#38bdf8" font-size="8.5" font-weight="600">Survives tab reload</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 170 75 L 194 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#scale-arr-blue)" />

    <!-- Stage 2: Bounded Step API -->
    <g transform="translate(198, 0)">
      <rect width="170" height="150" rx="6" fill="#0d172a" stroke="#2563eb" stroke-width="1.2" />
      <rect width="170" height="28" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.2" />
      <text x="12" y="19" fill="#bfdbfe" font-size="10.5" font-weight="700">2. BOUNDED STEP API</text>
      
      <text x="12" y="48" fill="#ffffff" font-size="10" font-weight="600">POST /jobs/:id/step</text>
      <text x="12" y="66" fill="#94a3b8" font-size="9">· 1,000–5,000 txns / slice</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9">· High-capacity limiter</text>
      <text x="12" y="94" fill="#94a3b8" font-size="9">· Strict execution timeout</text>
      <text x="12" y="108" fill="#94a3b8" font-size="9">· Lease allocation token</text>
      <text x="12" y="132" fill="#38bdf8" font-size="8.5" font-weight="600">Guaranteed sub-3s return</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 368 75 L 392 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#scale-arr-blue)" />

    <!-- Stage 3: Durable State Store -->
    <g transform="translate(396, 0)">
      <rect width="170" height="150" rx="6" fill="#0d172a" stroke="#2563eb" stroke-width="1.2" />
      <rect width="170" height="28" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.2" />
      <text x="12" y="19" fill="#bfdbfe" font-size="10.5" font-weight="700">3. DURABLE STATE STORE</text>
      
      <text x="12" y="48" fill="#ffffff" font-size="10" font-weight="600">PostgreSQL / SQLite WAL</text>
      <text x="12" y="66" fill="#94a3b8" font-size="9">· Optimistic CAS locking</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9">· version = version + 1</text>
      <text x="12" y="94" fill="#94a3b8" font-size="9">· Idempotency key match</text>
      <text x="12" y="108" fill="#94a3b8" font-size="9">· Atomic transaction lease</text>
      <text x="12" y="132" fill="#38bdf8" font-size="8.5" font-weight="600">0 lease race collisions</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 566 75 L 590 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#scale-arr-blue)" />

    <!-- Stage 4: Chunk Execution -->
    <g transform="translate(594, 0)">
      <rect width="170" height="150" rx="6" fill="#0d172a" stroke="#2563eb" stroke-width="1.2" />
      <rect width="170" height="28" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.2" />
      <text x="12" y="19" fill="#bfdbfe" font-size="10.5" font-weight="700">4. CHUNK EXECUTION</text>
      
      <text x="12" y="48" fill="#ffffff" font-size="10" font-weight="600">Deterministic Matcher</text>
      <text x="12" y="66" fill="#94a3b8" font-size="9">· Disjoint partition slice</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9">· Integer minor-unit math</text>
      <text x="12" y="94" fill="#94a3b8" font-size="9">· Zero cross-talk leakage</text>
      <text x="12" y="108" fill="#94a3b8" font-size="9">· Constant memory buffer</text>
      <text x="12" y="132" fill="#38bdf8" font-size="8.5" font-weight="600">Peak heap &lt;250MB</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 764 75 L 788 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#scale-arr-blue)" />

    <!-- Stage 5: Checkpoint -->
    <g transform="translate(792, 0)">
      <rect width="170" height="150" rx="6" fill="#0d172a" stroke="#2563eb" stroke-width="1.2" />
      <rect width="170" height="28" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.2" />
      <text x="12" y="19" fill="#bfdbfe" font-size="10.5" font-weight="700">5. PERSISTED STATE</text>
      
      <text x="12" y="48" fill="#ffffff" font-size="10" font-weight="600">Monotonic Checkpoint</text>
      <text x="12" y="66" fill="#94a3b8" font-size="9">· Atomic slice commit</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9">· completedCount updated</text>
      <text x="12" y="94" fill="#94a3b8" font-size="9">· progressPct monotonic</text>
      <text x="12" y="108" fill="#94a3b8" font-size="9">· Authoritative in DB</text>
      <text x="12" y="132" fill="#38bdf8" font-size="8.5" font-weight="600">Crash-safe on disk</text>
    </g>

    <!-- Arrow 5 -> 6 -->
    <path d="M 962 75 L 986 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#scale-arr-blue)" />

    <!-- Stage 6: Resume / Cancel -->
    <g transform="translate(990, 0)">
      <rect width="170" height="150" rx="6" fill="#0d172a" stroke="#2563eb" stroke-width="1.2" />
      <rect width="170" height="28" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.2" />
      <text x="12" y="19" fill="#bfdbfe" font-size="10.5" font-weight="700">6. RESUME / CANCEL</text>
      
      <text x="12" y="48" fill="#ffffff" font-size="10" font-weight="600">Cooperative State Control</text>
      <text x="12" y="66" fill="#94a3b8" font-size="9">· Resume next chunk slice</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9">· Stalled job auto-reclaim</text>
      <text x="12" y="94" fill="#f87171" font-size="9">· Cooperative cancellation</text>
      <text x="12" y="108" fill="#f87171" font-size="9">· &lt;1000ms terminal latency</text>
      <text x="12" y="132" fill="#38bdf8" font-size="8.5" font-weight="600">Atomic slice rollback</text>
    </g>

    <!-- Arrow 6 -> 7 -->
    <path d="M 1160 75 L 1184 75" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#scale-arr-green)" />

    <!-- Stage 7: Finality -->
    <g transform="translate(1188, 0)">
      <rect width="152" height="150" rx="6" fill="#062d1f" stroke="#059669" stroke-width="1.4" />
      <rect width="152" height="28" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1.4" />
      <text x="12" y="19" fill="#a7f3d0" font-size="10.5" font-weight="700">7. FINALITY</text>
      
      <text x="12" y="48" fill="#34d399" font-size="10" font-weight="700">Signed Receipts</text>
      <text x="12" y="66" fill="#d1fae5" font-size="9">· 100% completion seal</text>
      <text x="12" y="80" fill="#d1fae5" font-size="9">· RFC 8785 JSON proof</text>
      <text x="12" y="94" fill="#d1fae5" font-size="9">· HMAC-SHA256 hash</text>
      <text x="12" y="108" fill="#d1fae5" font-size="9">· Merkle DAG root</text>
      <text x="12" y="132" fill="#34d399" font-size="8.5" font-weight="600">Zero-LLM Replay</text>
    </g>
  </g>

  <!-- Scale Progression Track (Horizontal) -->
  <g transform="translate(30, 260)">
    <rect width="1340" height="200" rx="8" fill="#0c1322" stroke="#1e293b" stroke-width="1.2" />
    <rect width="1340" height="32" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="21" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">EMPIRICALLY VERIFIED WORKLOAD TIERS (IDENTICAL DETERMINISTIC INVARIANTS ACROSS ALL SCALES)</text>

    <!-- Tiers Container -->
    <g transform="translate(16, 46)">
      <!-- Tier 1: 250 -->
      <g transform="translate(0, 0)">
        <rect width="246" height="136" rx="6" fill="#10192b" stroke="#1e3a5f" stroke-width="1" />
        <rect width="246" height="26" rx="6" fill="#17253d" stroke="#1e3a5f" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700">250 Records</text>
        <text x="12" y="46" fill="#ffffff" font-size="10.5" font-weight="700">431ms · Interactive</text>
        <text x="12" y="66" fill="#94a3b8" font-size="9">· Official benchmark testbed</text>
        <text x="12" y="82" fill="#94a3b8" font-size="9">· 98.1% Accuracy verified</text>
        <text x="12" y="98" fill="#94a3b8" font-size="9">· 90% Adversarial catch rate</text>
        <text x="12" y="114" fill="#34d399" font-size="9" font-weight="600">96.4% Clean AI Fast-Path bypass</text>
      </g>

      <!-- Tier 2: 10K -->
      <g transform="translate(266, 0)">
        <rect width="246" height="136" rx="6" fill="#10192b" stroke="#1e3a5f" stroke-width="1" />
        <rect width="246" height="26" rx="6" fill="#17253d" stroke="#1e3a5f" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700">10,000 Transactions</text>
        <text x="12" y="46" fill="#ffffff" font-size="10.5" font-weight="700">1,246 rec/sec</text>
        <text x="12" y="66" fill="#94a3b8" font-size="9">· Continuous bounded stepping</text>
        <text x="12" y="82" fill="#94a3b8" font-size="9">· Operations Center coordination</text>
        <text x="12" y="98" fill="#94a3b8" font-size="9">· Rate-limit capacity headroom</text>
        <text x="12" y="114" fill="#34d399" font-size="9" font-weight="600">Continuous live progress UX</text>
      </g>

      <!-- Tier 3: 100K -->
      <g transform="translate(532, 0)">
        <rect width="246" height="136" rx="6" fill="#10192b" stroke="#1e3a5f" stroke-width="1" />
        <rect width="246" height="26" rx="6" fill="#17253d" stroke="#1e3a5f" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700">100,000 Transactions</text>
        <text x="12" y="46" fill="#ffffff" font-size="10.5" font-weight="700">Durable Chunked</text>
        <text x="12" y="66" fill="#94a3b8" font-size="9">· PostgreSQL WAL checkpointing</text>
        <text x="12" y="82" fill="#94a3b8" font-size="9">· Atomic chunk transaction commit</text>
        <text x="12" y="98" fill="#94a3b8" font-size="9">· Hardened AsyncJob primary key</text>
        <text x="12" y="114" fill="#34d399" font-size="9" font-weight="600">Zero memory degradation</text>
      </g>

      <!-- Tier 4: 1M -->
      <g transform="translate(798, 0)">
        <rect width="246" height="136" rx="6" fill="#10192b" stroke="#1e3a5f" stroke-width="1" />
        <rect width="246" height="26" rx="6" fill="#17253d" stroke="#1e3a5f" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700">1,000,000 Transactions</text>
        <text x="12" y="46" fill="#ffffff" font-size="10.5" font-weight="700">Partitioned Scale</text>
        <text x="12" y="66" fill="#94a3b8" font-size="9">· Regression-tested cancellation</text>
        <text x="12" y="82" fill="#94a3b8" font-size="9">· &lt;1000ms terminal latency</text>
        <text x="12" y="98" fill="#94a3b8" font-size="9">· Opportunistic finalization</text>
        <text x="12" y="114" fill="#34d399" font-size="9" font-weight="600">Cooperative cancellation verified</text>
      </g>

      <!-- Tier 5: 10M+ -->
      <g transform="translate(1064, 0)">
        <rect width="244" height="136" rx="6" fill="#10192b" stroke="#1e3a5f" stroke-width="1" />
        <rect width="244" height="26" rx="6" fill="#17253d" stroke="#1e3a5f" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700">10,000,000+ Transactions</text>
        <text x="12" y="46" fill="#ffffff" font-size="10.5" font-weight="700">Bounded Partitioned</text>
        <text x="12" y="66" fill="#94a3b8" font-size="9">· Validated workload handling</text>
        <text x="12" y="82" fill="#94a3b8" font-size="9">· Disjoint partition queues</text>
        <text x="12" y="98" fill="#94a3b8" font-size="9">· Constant memory footprint</text>
        <text x="12" y="114" fill="#34d399" font-size="9" font-weight="600">Zero cumulative drift</text>
      </g>
    </g>
  </g>

  <!-- Core Thesis Footer Banner -->
  <g transform="translate(30, 480)">
    <rect width="1340" height="52" rx="6" fill="#07111e" stroke="#1e293b" stroke-width="1" />
    <text x="670" y="32" fill="#38bdf8" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      “Workload scale changes execution volume, not financial decision authority.”
    </text>
  </g>
</svg>
