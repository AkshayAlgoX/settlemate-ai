<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="step-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="54" fill="#0f172a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700">SettleMate AI — Durable Bounded Step Execution Architecture</text>
  <text x="24" y="44" fill="#94a3b8" font-size="11">Durable State Machine · Monotonic Progress · SLA &lt;1000ms Cooperative Cancellation</text>

  <!-- Step Flow Loop -->
  <g transform="translate(24, 75)">
    <!-- Box 1: Operations Center -->
    <g transform="translate(0, 0)">
      <rect width="165" height="120" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
      <rect width="165" height="26" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="82" y="17" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle">1. Operations Center</text>
      <text x="12" y="48" fill="#0f172a" font-size="10.5" font-weight="600">Client Step Controller</text>
      <text x="12" y="66" fill="#475569" font-size="9.5">· Drives bounded steps</text>
      <text x="12" y="82" fill="#475569" font-size="9.5">· No monolithic request</text>
      <text x="12" y="98" fill="#475569" font-size="9.5">· Survives tab reloads</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 165 60 L 195 60" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#step-arrow)" />

    <!-- Box 2: Bounded Step Endpoint -->
    <g transform="translate(200, 0)">
      <rect width="165" height="120" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
      <rect width="165" height="26" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="82" y="17" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle">2. Bounded Step API</text>
      <text x="12" y="48" fill="#0f172a" font-size="10.5" font-weight="600">POST /jobs/:id/step</text>
      <text x="12" y="66" fill="#475569" font-size="9.5">· Lease-lock chunk</text>
      <text x="12" y="82" fill="#475569" font-size="9.5">· 1,000–5,000 txns/slice</text>
      <text x="12" y="98" fill="#475569" font-size="9.5">· Execution timeout guard</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 365 60 L 395 60" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#step-arrow)" />

    <!-- Box 3: Durable Storage & CAS -->
    <g transform="translate(400, 0)">
      <rect width="165" height="120" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
      <rect width="165" height="26" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="82" y="17" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle">3. Durable Storage</text>
      <text x="12" y="48" fill="#0f172a" font-size="10.5" font-weight="600">PostgreSQL / SQLite</text>
      <text x="12" y="66" fill="#475569" font-size="9.5">· Optimistic CAS locking</text>
      <text x="12" y="82" fill="#475569" font-size="9.5">· Atomic chunk commit</text>
      <text x="12" y="98" fill="#475569" font-size="9.5">· Monotonic checkpoint</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 565 60 L 595 60" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#step-arrow)" />

    <!-- Box 4: Chunk Execution -->
    <g transform="translate(600, 0)">
      <rect width="150" height="120" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
      <rect width="150" height="26" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="75" y="17" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle">4. Chunk Match</text>
      <text x="12" y="48" fill="#0f172a" font-size="10.5" font-weight="600">Deterministic Run</text>
      <text x="12" y="66" fill="#475569" font-size="9.5">· Disjoint partition run</text>
      <text x="12" y="82" fill="#475569" font-size="9.5">· Zero cross-talk error</text>
      <text x="12" y="98" fill="#475569" font-size="9.5">· Constant memory footprint</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 750 60 L 775 60" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#step-arrow)" />

    <!-- Box 5: Checkpoint & State Transitions -->
    <g transform="translate(780, 0)">
      <rect width="132" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#shadow-sm)" />
      <rect width="132" height="26" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5" />
      <text x="66" y="17" fill="#065f46" font-size="10.5" font-weight="700" text-anchor="middle">5. Finality &amp; Control</text>
      <text x="10" y="48" fill="#065f46" font-size="10" font-weight="700">· Next Step Loop</text>
      <text x="10" y="66" fill="#047857" font-size="9">· Resume on failure</text>
      <text x="10" y="82" fill="#047857" font-size="9">· Cancel &lt;1000ms SLA</text>
      <text x="10" y="98" fill="#047857" font-size="9">· Receipt on 100%</text>
    </g>
  </g>

  <!-- Scale Progression Track -->
  <g transform="translate(24, 215)">
    <rect width="912" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="18" y="24" fill="#0f172a" font-size="12" font-weight="700">Empirically Verified Workload Tiers (Zero Financial Drift Across All Scales)</text>

    <!-- Scale Items Grid -->
    <g transform="translate(18, 40)">
      <!-- 250 -->
      <rect x="0" y="0" width="165" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">250 Records</text>
      <text x="12" y="40" fill="#2563eb" font-size="10.5" font-weight="600">431ms · Interactive</text>
      <text x="12" y="58" fill="#64748b" font-size="9.5">Official Benchmark Baseline</text>

      <!-- 10K -->
      <rect x="178" y="0" width="165" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">10,000 Records</text>
      <text x="12" y="40" fill="#2563eb" font-size="10.5" font-weight="600">1,246 rec/sec</text>
      <text x="12" y="58" fill="#64748b" font-size="9.5">Continuous stepping</text>

      <!-- 100K -->
      <rect x="356" y="0" width="165" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">100,000 Records</text>
      <text x="12" y="40" fill="#2563eb" font-size="10.5" font-weight="600">Durable Chunked</text>
      <text x="12" y="58" fill="#64748b" font-size="9.5">PostgreSQL checkpointed</text>

      <!-- 1M -->
      <rect x="534" y="0" width="165" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">1,000,000 Records</text>
      <text x="12" y="40" fill="#2563eb" font-size="10.5" font-weight="600">Partitioned SLA</text>
      <text x="12" y="58" fill="#64748b" font-size="9.5">&lt;1000ms Cancel SLA verified</text>

      <!-- 10M+ -->
      <rect x="712" y="0" width="165" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-sm)" />
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">10,000,000+ Records</text>
      <text x="12" y="40" fill="#2563eb" font-size="10.5" font-weight="600">Scale Validated</text>
      <text x="12" y="58" fill="#64748b" font-size="9.5">Bounded partitioned scale</text>
    </g>
  </g>

  <!-- Core Thesis Footer Banner -->
  <g transform="translate(24, 368)">
    <rect width="912" height="52" rx="6" fill="#0f172a" />
    <text x="456" y="32" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">
      “Workload scale changes execution volume, not financial decision authority.”
    </text>
  </g>
</svg>
