services:
  - type: web
    name: settlemate-ai
    env: node
    plan: free
    buildCommand: npm ci && npm run build:prod
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRISMA_TARGET_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_SHARED_SECRET
        sync: false
      - key: METRICS_TOKEN
        sync: false
      # Receipt HMAC key for the active version (v1). Render generates a random
      # 256-bit value. See docs/receipt-signing.md before rotating.
      - key: RECEIPT_SIGNING_SECRET_V1
        generateValue: true
      - key: RECEIPT_SIGNING_ACTIVE_VERSION
        value: v1
